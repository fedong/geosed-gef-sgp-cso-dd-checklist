<title>GeoSED · GEF SGP Due Diligence Checklist</title>
<meta name="description" content="Everything GeoSED must satisfy to pass the GEF SGP CSO Challenge, grouped by when each thing is checked.">
<meta name="robots" content="noindex,nofollow">

<style id="css">

:root{
  --paper:#EDF0EE; --surface:#F7F9F7; --ink:#10201F; --muted:#5C6B67;
  --hair:#C3D0CC; --teal:#0E4F53; --teal-soft:#DCE8E7;
  --ochre:#A96A16; --ochre-soft:#F0E2CC;
  --done:#2E6B4E; --done-soft:#D8E7DF;
  --crit:#9C3B2C; --crit-soft:#F3DCD7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B1211; --surface:#111B1A; --ink:#E2E9E6; --muted:#93A5A1;
    --hair:#283937; --teal:#54B8BB; --teal-soft:#162726;
    --ochre:#D69B3F; --ochre-soft:#33270F;
    --done:#6BBE92; --done-soft:#15281F;
    --crit:#E08573; --crit-soft:#2E1712;
  }
}
:root[data-theme="dark"]{
  --paper:#0B1211; --surface:#111B1A; --ink:#E2E9E6; --muted:#93A5A1;
  --hair:#283937; --teal:#54B8BB; --teal-soft:#162726;
  --ochre:#D69B3F; --ochre-soft:#33270F;
  --done:#6BBE92; --done-soft:#15281F;
  --crit:#E08573; --crit-soft:#2E1712;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1480px;margin:0 auto;padding:0 26px 90px}
.col{max-width:66ch}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(2.2rem,5vw,3.3rem);
   line-height:1.04;letter-spacing:-.02em;margin:12px 0 0;text-wrap:balance}
h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.6rem;line-height:1.15;
   letter-spacing:-.015em;margin:0 0 6px;text-wrap:balance}
h3{font-size:.98rem;font-weight:600;margin:26px 0 8px}
p{margin:0 0 14px}
.kicker{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--teal);font-weight:500}
header.mast{padding:48px 0 0}
.standfirst{max-width:60ch;margin:16px 0 0;font-size:1.08rem;color:var(--muted);line-height:1.5}

/* ---- progress readout ---- */
.readout{margin:34px 0 0;border-top:1.5px solid var(--teal);border-bottom:1px solid var(--hair);
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.rcell{padding:14px 18px 14px 0;border-right:1px solid var(--hair)}
.rcell:last-child{border-right:0}
.rlab{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.rval{font-family:"IBM Plex Mono",monospace;font-size:1.35rem;font-weight:500;margin-top:4px;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.rval.hot{color:var(--ochre)}
.rsub{font-size:11.5px;color:var(--muted);margin-top:2px}

/* ---- explainer ---- */
.explain{background:var(--surface);border:1px solid var(--hair);padding:24px 26px;margin:34px 0 0}
.explain p{max-width:64ch}
.explain p:last-child{margin-bottom:0}

/* ---- stage strip ---- */
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:22px}
.stage{border-top:2px solid var(--teal);padding-top:12px}
.stage .sn{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--teal);font-weight:600}
.stage .st{font-weight:600;margin-top:5px;font-size:1rem}
.stage .sd{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}
.stage.now{border-top-color:var(--ochre)}
.stage.now .sn{color:var(--ochre)}

/* ---- gate ---- */
.gate{margin-top:58px}
.ghead{border-top:1.5px solid var(--teal);padding-top:16px}
.gmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:16px 26px;margin:14px 0 0}
.gm{font-size:13px;color:var(--muted);line-height:1.45}
.gm b{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--teal);font-weight:600;margin-bottom:2px}
.gnum{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);font-weight:500}

/* ---- items ---- */
.items{margin-top:22px;border-top:1px solid var(--hair)}
.item-head,.item{display:grid;grid-template-columns:30px minmax(300px,1fr) 118px 178px 142px 170px;
  gap:14px;align-items:start}
.item-head{padding:0 0 9px;border-bottom:1px solid var(--hair);font-family:"IBM Plex Mono",monospace;
  font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.item{padding:14px 0;border-bottom:1px solid var(--hair)}
.item.is-done .txt{color:var(--muted)}
.item.is-done .txt strong{text-decoration:line-through;text-decoration-thickness:1px}
.box{width:20px;height:20px;margin-top:2px;border:1.5px solid var(--muted);border-radius:3px;
  background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;
  color:transparent;font-size:13px;line-height:1;transition:none}
.box:hover{border-color:var(--teal)}
.box[aria-checked="true"]{background:var(--done);border-color:var(--done);color:var(--paper)}
.box:disabled{cursor:default;opacity:.5}
.box:focus-visible,select:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.txt{font-size:14.5px;line-height:1.5}
.txt strong{font-weight:600}
.txt span{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.chip{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;padding:4px 7px;border:1px solid transparent;border-radius:2px;
  font-weight:600;white-space:nowrap}
.chip.hard{background:var(--crit-soft);color:var(--crit)}
.chip.flag{background:var(--ochre-soft);color:var(--ochre)}
.chip.later{background:transparent;border-color:var(--hair);color:var(--muted)}
.chip.closed{background:var(--done-soft);color:var(--done)}

/* ---- chip legend ---- */
.lgh{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--teal);font-weight:600;margin-top:26px;padding-top:22px;border-top:1px solid var(--hair)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(224px,1fr));gap:16px 26px;margin-top:14px}
.lg .chip{margin-bottom:6px}
.lg p{font-size:12.5px;color:var(--muted);margin:0;line-height:1.45}

/* ---- team ---- */
.team{margin-top:46px;border-top:1.5px solid var(--teal);padding-top:16px}
.teamp{font-size:13.5px;color:var(--muted);max-width:62ch;margin:6px 0 0}
.chipsrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.mchip{display:inline-flex;align-items:center;gap:7px;font-size:13px;background:var(--surface);
  border:1px solid var(--hair);border-radius:3px;padding:4px 7px 4px 11px}
.mchip.fixed{padding-right:11px}
.mchip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;
  line-height:1;padding:0 2px;border-radius:2px;font-family:inherit}
.mchip button:hover{color:var(--crit)}
.addrow{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}
.addrow input{flex:0 1 262px;font-family:inherit;font-size:13.5px;color:var(--ink);
  background:var(--surface);border:1px solid var(--hair);border-radius:3px;padding:7px 10px}
.addrow button{font-family:inherit;font-size:13px;font-weight:600;color:var(--paper);
  background:var(--teal);border:0;border-radius:3px;padding:7px 15px;cursor:pointer}
.addrow input:focus-visible,.addrow button:focus-visible,.mchip button:focus-visible{
  outline:2px solid var(--ochre);outline-offset:2px}
.err{margin-top:9px;font-size:12.5px;color:var(--crit)}
.err[hidden]{display:none}
select{width:100%;font-family:"IBM Plex Sans",sans-serif;font-size:12.5px;color:var(--ink);
  background:var(--surface);border:1px solid var(--hair);border-radius:3px;padding:5px 6px}
select:disabled{opacity:.55}
.audit-cell{font-size:11.5px;line-height:1.35;color:var(--muted);padding-top:5px}
.audit-cell.empty{font-style:italic}
.file-cell{min-width:0}
.file-input{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.file-btn{display:inline-block;font-family:"IBM Plex Sans",sans-serif;font-size:12px;font-weight:600;
  color:var(--teal);background:var(--surface);border:1px solid var(--hair);border-radius:3px;
  padding:5px 8px;cursor:pointer;line-height:1.25}
.file-btn:hover{border-color:var(--teal)}
.file-input:disabled + .file-btn{opacity:.55;cursor:not-allowed}
.file-input:focus-visible + .file-btn{outline:2px solid var(--ochre);outline-offset:2px}
.file-name{display:block;margin-top:5px;font-size:11px;line-height:1.3;color:var(--muted);
  overflow-wrap:anywhere}
.file-remove{border:0;background:none;color:var(--crit);font:inherit;font-size:11px;padding:2px 0;
  cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.not-needed{display:block;padding-top:5px;color:var(--muted);font-size:12px}
.storage-note{font-size:12.5px;color:var(--muted);margin:10px 0 0;max-width:78ch}
.syncrow{display:flex;align-items:center;flex-wrap:wrap;gap:9px 14px;margin-top:13px}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--ochre);box-shadow:0 0 0 3px var(--ochre-soft)}
.syncdot.ok{background:var(--done);box-shadow:0 0 0 3px var(--done-soft)}
.syncdot.bad{background:var(--crit);box-shadow:0 0 0 3px var(--crit-soft)}
.synctext{font-size:12.5px;color:var(--muted)}
.file-link{display:inline-block;margin:5px 8px 0 0;border:0;background:none;color:var(--teal);
  font:inherit;font-size:11px;font-weight:600;padding:2px 0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.file-link:disabled{opacity:.55;cursor:wait}

/* ---- banner ---- */
.banner{margin-top:26px;padding:12px 16px;background:var(--ochre-soft);color:var(--ochre);
  font-size:13.5px;font-weight:500}
.banner[hidden]{display:none}

footer{margin-top:70px;padding-top:20px;border-top:1.5px solid var(--teal);
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);
  display:flex;flex-wrap:wrap;gap:8px 26px;letter-spacing:.03em}

@media (max-width:1180px){
  .item-head{display:none}
  .item{grid-template-columns:30px minmax(240px,1fr) 118px 178px;gap:12px 14px}
  .item .updated-cell{grid-column:2}
  .item .updatedby-cell{grid-column:3}
  .updated-cell::before,.updatedby-cell::before{display:block;margin-bottom:4px;
    font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .updated-cell::before{content:"Last updated"}
  .updatedby-cell::before{content:"Updated by"}
}
@media (max-width:760px){
  .item{grid-template-columns:26px 1fr;gap:10px}
  .item .chip-cell,.item .own-cell,.item .updated-cell,.item .updatedby-cell{grid-column:2}
  .own-cell select,.updatedby-cell select{max-width:260px}
}
@media print{
  .addrow{display:none}
  .box{border-color:#666}
  select{border:0;background:none;appearance:none}
  .file-btn,.file-remove,.file-link{display:none}
  .banner,.explain{background:none}
  .gate{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- standalone maintenance block ---- */
.maint{margin-top:60px;padding-top:20px;border-top:1px solid var(--hair)}
.mainth{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);font-weight:600}
.maintp{font-size:12.5px;color:var(--muted);max-width:74ch;margin:8px 0 0;line-height:1.5}
.maintp code{font-family:"IBM Plex Mono",monospace;font-size:.94em}
.addrow.tools{margin-top:14px}
.addrow button.ghost{background:transparent;color:var(--teal);border:1px solid var(--hair)}
.toolmsg{align-self:center;font-size:12.5px;color:var(--muted)}
@media print{ .maint{display:none} }
</style>

// the roster lives in shared state so the team can extend it
if(!Array.isArray(STATE.owners) || !STATE.owners.length) STATE.owners = DEFAULT_OWNERS.slice();
STATE.owners = STATE.owners.filter(function(o, i, a){
  return typeof o === "string" && o.trim() && a.indexOf(o) === i;
});
if(STATE.owners.indexOf("Unassigned") < 0) STATE.owners.unshift("Unassigned");
ALL.forEach(function(it){                 // never orphan an existing assignment
  var o = STATE.items[it.id].owner;
  if(o && STATE.owners.indexOf(o) < 0) STATE.owners.push(o);
});

var canWrite = false;
var api = null;
var syncState = "connecting";
var syncMessage = "Connecting to the shared checklist…";

// ---------- render ----------
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function counts(){
  var t=0,d=0;
  ALL.forEach(function(it){
    t++; var r=STATE.items[it.id];
    if(r.done) d++;
  });
  return {total:t, done:d};
}
function stamp(){
  if(!STATE.updated) return "not yet updated";
  var dt = new Date(STATE.updated);
  if(isNaN(dt)) return "not yet updated";
  return dt.toISOString().slice(0,16).replace("T"," ") + " UTC";
}
function rowStamp(value){
  if(!value) return "Not updated";
  var dt = new Date(value);
  if(isNaN(dt)) return "Not updated";
  try {
    return new Intl.DateTimeFormat(undefined, {
      year:"numeric", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"
    }).format(dt);
  } catch(e){
    return dt.toISOString().slice(0,16).replace("T"," ") + " UTC";
  }
}
function render(){
  var c = counts();
  var h = "";

  h += '<header class="mast">'
    +  '<div class="kicker">GEF SGP CSO Challenge · GeoSED, Inc.</div>'
    +  '<h1>Due diligence checklist</h1>'
    +  '<p class="standfirst">Confirm whether each required item is available and keep the shared status current.</p>'
    +  '</header>';

  h += '<div class="readout">'
    +  cell("Items closed", c.done + " / " + c.total, "", false)
    +  cell("Last updated", stamp(), "", false)
    +  '</div>';

  // standalone build: no top banner

  h += '<section class="team">'
    +  '<h2>Team</h2>'
    +  '<p class="teamp">Anyone on this list can be assigned an item. Removing someone returns their items to Unassigned.</p>'
    +  '<div class="chipsrow">'
    +  STATE.owners.map(function(o){
         if(o === "Unassigned") return '<span class="mchip fixed">' + esc(o) + '</span>';
         return '<span class="mchip">' + esc(o)
           + (canWrite ? '<button type="button" data-rm="' + esc(o) + '" aria-label="Remove ' + esc(o) + '">×</button>' : '')
           + '</span>';
       }).join("")
    +  '</div>'
    +  (canWrite
        ? '<div class="addrow"><input id="newown" type="text" maxlength="' + MAX_NAME
          + '" placeholder="Name of new member" autocomplete="off">'
          + '<button id="addown" type="button">Add member</button></div>'
        : '')
    +  '<div class="err" id="ownerr" hidden></div>'
    +  '</section>';

  GATES.forEach(function(g, gi){
    var gc = g.items.filter(function(it){ return STATE.items[it.id].done; }).length;
    h += '<section class="gate">'
      +  '<div class="ghead">'
      +  '<div class="gnum">' + esc(g.n) + ' · ' + gc + ' of ' + g.items.length + ' closed</div>'
      +  '<h2>' + esc(g.name) + '</h2>'
      +  '</div>'
      +  '<div class="items">';

    h += '<div class="item-head" aria-hidden="true">'
      + '<span></span><span>Requirement</span><span>Status</span><span>Assigned to</span>'
      + '<span>Last updated</span><span>Updated by</span></div>';

    g.items.forEach(function(it){
      var r = STATE.items[it.id];
      var sv = r.done ? AVAILABLE : NOT_AVAILABLE;
      h += '<div class="item' + (r.done ? " is-done" : "") + '">'
        +  '<button class="box" type="button" data-id="' + esc(it.id) + '" role="checkbox" '
        +  'aria-checked="' + (r.done ? "true" : "false") + '" '
        +  'aria-label="' + esc(it.t) + '"' + (canWrite ? "" : " disabled") + '>✓</button>'
        +  '<div class="txt"><strong>' + esc(it.t) + '</strong></div>'
        +  '<div class="chip-cell"><span class="chip ' + sv.cls + '">' + esc(sv.label) + '</span></div>'
        +  '<div class="own-cell"><select data-owner="' + esc(it.id) + '"' + (canWrite ? "" : " disabled") + '>'
        +  STATE.owners.map(function(o){
             return '<option value="' + esc(o) + '"' + (o === r.owner ? " selected" : "") + '>' + esc(o) + '</option>';
           }).join("")
        +  '</select></div>'
        +  '<div class="audit-cell updated-cell' + (r.updatedAt ? "" : " empty") + '">' + esc(rowStamp(r.updatedAt)) + '</div>'
        +  '<div class="updatedby-cell"><select data-updated-by="' + esc(it.id) + '" aria-label="Updated by for ' + esc(it.t) + '"' + (canWrite ? "" : " disabled") + '>'
        +  '<option value=""' + (r.updatedBy ? "" : " selected") + '>Not specified</option>'
        +  STATE.owners.filter(function(o){ return o !== "Unassigned"; }).map(function(o){
             return '<option value="' + esc(o) + '"' + (o === r.updatedBy ? " selected" : "") + '>' + esc(o) + '</option>';
           }).join("")
        +  '</select></div>'
        +  '</div>';
    });
    h += '</div></section>';
  });

  h += '<section class="maint">'
    +  '<div class="mainth">Shared checklist</div>'
    +  '<p class="maintp">Changes are saved automatically to the shared Supabase database and appear for everyone '
    +  'using this page.</p>'
    +  '<div class="syncrow"><span class="syncdot ' + (syncState === "online" ? "ok" : syncState === "error" ? "bad" : "") + '"></span>'
    +  '<span class="synctext">' + esc(syncMessage) + '</span>'
    +  '<button id="copystat" type="button" class="file-btn">Copy status</button>'
    +  '<span id="copymsg" class="toolmsg"></span></div>'
    +  '<p class="storage-note"><strong>Public access:</strong> no login is required. Anyone who can open the site can '
    +  'view or change checklist status and assignments.</p></section>';

  h += '<footer>'
    +  '<span>GeoSED, Inc. · Bantay Mandulog</span>'
    +  '<span>Public shared status page</span>'
    +  '</footer>';

  document.getElementById("app").innerHTML = h;
  var ro = document.getElementById("ro");
  if(ro) ro.hidden = canWrite;
}

function cell(lab, val, sub, hot){
  return '<div class="rcell"><div class="rlab">' + esc(lab) + '</div>'
    + '<div class="rval' + (hot ? " hot" : "") + '">' + esc(val) + '</div>'
    + (sub ? '<div class="rsub">' + esc(sub) + '</div>' : "") + '</div>';
}
// ---------- Supabase data, storage and realtime ----------
function setSync(state, message, redraw){
  syncState = state;
  syncMessage = message;
  if(redraw !== false) render();
}
function applyRow(row){
  if(!row || !STATE.items[row.id]) return;
  var rec = STATE.items[row.id];
  rec.done = !!row.done;
  rec.owner = row.owner || "Unassigned";
  rec.updatedAt = row.updated_at || "";
  rec.updatedBy = row.updated_by || "";
  if(row.updated_at && (!STATE.updated || row.updated_at > STATE.updated)) STATE.updated = row.updated_at;
}
function itemPayload(id){
  var rec = STATE.items[id];
  return {
    id:id,
    done:!!rec.done,
    owner:rec.owner || "Unassigned",
    updated_by:rec.updatedBy || null
  };
}
async function persistItem(id){
  if(!api || !STATE.items[id]) return false;
  setSync("connecting", "Saving change…");
  var result = await api.from("checklist_items").upsert(itemPayload(id), {onConflict:"id"}).select().single();
  if(result.error){
    setSync("error", "Could not save: " + result.error.message);
    return false;
  }
  applyRow(result.data);
  setSync("online", "All changes saved · live updates connected");
  return true;
}
async function seedSharedData(rows, members){
  var present = {};
  rows.forEach(function(row){ present[row.id] = true; applyRow(row); });
  var missing = ALL.filter(function(it){ return !present[it.id]; }).map(function(it){ return itemPayload(it.id); });
  if(missing.length){
    var inserted = await api.from("checklist_items").insert(missing).select();
    if(inserted.error) throw inserted.error;
    (inserted.data || []).forEach(applyRow);
  }
  var names = {};
  members.forEach(function(row){ if(row.name) names[row.name] = true; });
  var missingNames = DEFAULT_OWNERS.filter(function(name){ return !names[name]; }).map(function(name){ return {name:name}; });
  if(missingNames.length){
    var added = await api.from("team_members").insert(missingNames).select();
    if(added.error) throw added.error;
    members = members.concat(added.data || []);
  }
  STATE.owners = members.map(function(row){ return row.name; }).filter(Boolean).sort(function(a,b){
    if(a === "Unassigned") return -1;
    if(b === "Unassigned") return 1;
    return a.localeCompare(b);
  });
}
function subscribeRealtime(){
  api.channel("geosed-dd-live")
    .on("postgres_changes", {event:"*", schema:"public", table:"checklist_items"}, function(payload){
      if(payload.new && payload.new.id) applyRow(payload.new);
      setSync("online", "All changes saved · live updates connected");
    })
    .on("postgres_changes", {event:"*", schema:"public", table:"team_members"}, function(){
      refreshTeam();
    })
    .subscribe(function(status){
      if(status === "SUBSCRIBED") setSync("online", "All changes saved · live updates connected");
      if(status === "CHANNEL_ERROR" || status === "TIMED_OUT") setSync("error", "Live updates disconnected. Refresh to reconnect.");
    });
}
async function refreshTeam(){
  if(!api) return;
  var result = await api.from("team_members").select("name").order("name");
  if(result.error) return;
  STATE.owners = result.data.map(function(row){ return row.name; });
  var u = STATE.owners.indexOf("Unassigned");
  if(u > 0){ STATE.owners.splice(u,1); STATE.owners.unshift("Unassigned"); }
  render();
}
async function initSupabase(){
  var cfg = window.GEOSED_CONFIG || {};
  if(!window.supabase || !cfg.SUPABASE_URL || !cfg.SUPABASE_PUBLISHABLE_KEY
      || /YOUR-PROJECT/.test(cfg.SUPABASE_URL) || /YOUR-SUPABASE/.test(cfg.SUPABASE_PUBLISHABLE_KEY)){
    setSync("error", "Setup required: add the Supabase URL and publishable key in config.js");
    return;
  }
  try {
    api = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_PUBLISHABLE_KEY);
    var results = await Promise.all([
      api.from("checklist_items").select("id,done,owner,updated_at,updated_by"),
      api.from("team_members").select("name")
    ]);
    if(results[0].error) throw results[0].error;
    if(results[1].error) throw results[1].error;
    await seedSharedData(results[0].data || [], results[1].data || []);
    canWrite = true;
    setSync("online", "All changes saved · live updates connected");
    subscribeRealtime();
  } catch(e){
    canWrite = false;
    setSync("error", "Could not connect: " + (e && e.message ? e.message : "unknown error"));
  }
}
// a plain-text summary someone can paste into the group chat
function statusText(){
  var c = counts(), lines = [];
  lines.push("GeoSED · GEF SGP due diligence — " + c.done + " of " + c.total + " items available");
  lines.push("As at " + stamp());
  GATES.forEach(function(g){
    var open = g.items.filter(function(it){ return !STATE.items[it.id].done; });
    lines.push("");
    lines.push(g.n + " · " + g.name + " — " + (g.items.length - open.length) + " of " + g.items.length + " closed");
    open.forEach(function(it){
      var rec = STATE.items[it.id];
      lines.push("  [ ] " + it.t + "  (" + rec.owner + ")"
        );
    });
    if(!open.length) lines.push("  all closed");
  });
  return lines.join("\n");
}
function copyStatus(){
  var msg = document.getElementById("copymsg");
  var text = statusText();
  function done(ok){ if(msg){ msg.textContent = ok ? "Copied." : "Could not copy — select the page text instead."; } }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(false); });
    return;
  }
  try {
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.top = "-1000px";
    document.body.appendChild(ta); ta.select();
    done(document.execCommand("copy"));
    document.body.removeChild(ta);
  } catch(e){ done(false); }
}

// ---------- events ----------
document.getElementById("app").addEventListener("click", async function(e){
  var btn = e.target.closest ? e.target.closest(".box") : null;
  if(!btn || btn.disabled) return;
  var id = btn.getAttribute("data-id");
  if(!STATE.items[id]) return;
  STATE.items[id].done = !STATE.items[id].done;
  render();
  await persistItem(id);
});
function ownerError(msg){
  var el = document.getElementById("ownerr");
  if(!el) return;
  el.textContent = msg || "";
  el.hidden = !msg;
}
async function addOwner(){
  var input = document.getElementById("newown");
  if(!input) return;
  var name = input.value.replace(/\s+/g, " ").trim();
  if(!name) return;
  if(name.length > MAX_NAME){ ownerError("Keep the name to " + MAX_NAME + " characters or fewer."); return; }
  var clash = null;
  STATE.owners.forEach(function(o){ if(o.toLowerCase() === name.toLowerCase()) clash = o; });
  if(clash){ ownerError(clash + " is already on the list."); return; }
  if(STATE.owners.length >= MAX_OWNERS){ ownerError("The list is full at " + MAX_OWNERS + " members."); return; }
  setSync("connecting", "Adding team member…");
  var result = await api.from("team_members").insert({name:name});
  if(result.error){ ownerError("Could not add member: " + result.error.message); setSync("error", "Team update failed."); return; }
  STATE.owners.push(name);
  STATE.owners.sort(function(a,b){ if(a === "Unassigned") return -1; if(b === "Unassigned") return 1; return a.localeCompare(b); });
  setSync("online", "All changes saved · live updates connected");
  var again = document.getElementById("newown");
  if(again) again.focus();
}
async function removeOwner(name){
  if(!api || name === "Unassigned") return;
  setSync("connecting", "Removing team member…");
  var changedOwner = await api.from("checklist_items").update({owner:"Unassigned"}).eq("owner", name);
  if(changedOwner.error){ setSync("error", "Could not reassign items: " + changedOwner.error.message); return; }
  var changedUpdater = await api.from("checklist_items").update({updated_by:null}).eq("updated_by", name);
  if(changedUpdater.error){ setSync("error", "Could not update audit records: " + changedUpdater.error.message); return; }
  var removed = await api.from("team_members").delete().eq("name", name);
  if(removed.error){ setSync("error", "Could not remove member: " + removed.error.message); return; }
  STATE.owners = STATE.owners.filter(function(o){ return o !== name; });
  ALL.forEach(function(it){
    if(STATE.items[it.id].owner === name) STATE.items[it.id].owner = "Unassigned";
    if(STATE.items[it.id].updatedBy === name) STATE.items[it.id].updatedBy = "";
  });
  setSync("online", "All changes saved · live updates connected");
}
document.getElementById("app").addEventListener("click", async function(e){
  var t = e.target;
  if(t && t.id === "addown"){ await addOwner(); return; }
  if(t && t.id === "copystat"){ copyStatus(); return; }
  var rm = t && t.closest ? t.closest("[data-rm]") : null;
  if(!rm || !canWrite) return;
  var name = rm.getAttribute("data-rm");
  var i = STATE.owners.indexOf(name);
  if(i < 0 || name === "Unassigned") return;
  await removeOwner(name);
});
document.getElementById("app").addEventListener("keydown", function(e){
  if(e.key === "Enter" && e.target && e.target.id === "newown"){ e.preventDefault(); addOwner(); }
});
document.getElementById("app").addEventListener("change", async function(e){
  var control = e.target;
  if(!control || !control.getAttribute) return;
  var id = control.getAttribute("data-owner");
  if(id && STATE.items[id]){
    STATE.items[id].owner = control.value;
    render();
    await persistItem(id);
    return;
  }
  id = control.getAttribute("data-updated-by");
  if(id && STATE.items[id]){
    STATE.items[id].updatedBy = control.value;
    render();
    await persistItem(id);
    return;
  }
});

render();
initSupabase();
})();

</script>
